name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: gpu-workbench-linux-x86_64
            bin: target/release/gpu-workbench
          - os: windows-latest
            artifact: gpu-workbench-windows-x86_64
            bin: target/release/gpu-workbench.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Smoke test on software Vulkan + OpenGL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libegl1 libgl1-mesa-dri
          ARGS="--cli --tests upload,bandwidth,matmul32,vram --transfer-mb 64 --matmul-n 256 --vram-mb 128 --vram-passes 1"
          WGPU_BACKEND=vulkan ./target/release/gpu-workbench $ARGS
          WGPU_BACKEND=gl ./target/release/gpu-workbench $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
