name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: gpu-workbench-linux-x86_64
            bin: target/release/gpu-workbench
          - os: windows-latest
            artifact: gpu-workbench-windows-x86_64
            bin: target/release/gpu-workbench.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      # Unit tests (including naga validation of every WGSL kernel) and
      # integration tests that run the binary's command-line interface.
      - name: Unit and CLI tests
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Install software GPU drivers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libegl1 libgl1-mesa-dri xvfb \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2
      - name: CLI smoke test on software Vulkan and OpenGL (Linux)
        if: runner.os == 'Linux'
        run: scripts/smoke-cli.sh target/release/gpu-workbench
      - name: GUI smoke test under Xvfb (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a scripts/smoke-gui.sh target/release/gpu-workbench
      # GitHub's Windows runners have no GPU, but DX12 exposes the WARP software
      # rasterizer as an adapter, so the DX12 code path still runs end to end.
      - name: CLI smoke test on software DX12 (WARP, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WGPU_BACKEND: dx12
        run: |
          & .\target\release\gpu-workbench.exe --list
          if ($LASTEXITCODE -ne 0) { throw "--list failed with $LASTEXITCODE" }
          & .\target\release\gpu-workbench.exe --cli --tests upload,readback,copy,bandwidth,matmul32,vram --transfer-mb 64 --matmul-n 256 --vram-mb 128 --vram-passes 1
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke test failed with $LASTEXITCODE" }
      - name: Show session log on failure (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA\gpu-workbench\logs" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 1 | Get-Content
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
